[project]
name = "summary"
version = "1.0.0"
description = "GenAI Summary Service for MP3 transcription and summarization"
requires-python = ">=3.12"
dependencies = [
    "pika>=1.3.2",
    "pymongo>=4.10.1",
    "openai>=1.57.0",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []
