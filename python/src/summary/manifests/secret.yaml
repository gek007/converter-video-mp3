apiVersion: v1
kind: Secret
metadata:
  name: summary-secrets
  namespace: video-converter
type: Opaque
stringData:
  # IMPORTANT: Replace with your actual OpenAI API key before deploying
  OPENAI_API_KEY: your-openai-api-key-here

  # RabbitMQ password (if different from default)
  RABBITMQ_PASS: guest
