apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
  template:
    metadata:
      labels:
        app: gateway
    spec:
      volumes:
        - name: code-volume
          configMap:
            name: gateway-code
      containers:
        - name: gateway
          image: gek007/gateway:latest
          volumeMounts:
            - name: code-volume
              mountPath: /app/server.py
              subPath: server.py
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets



