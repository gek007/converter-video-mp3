apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter
  labels:
    app: converter
spec:
  replicas: 4
  selector:
    matchLabels:
      app: converter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 8
  template:
    metadata:
      labels:
        app: converter
    spec:
      containers:
        - name: converter
          image: gek007/converter:latest
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: converter-config
            - secretRef:
                name: converter-secrets
